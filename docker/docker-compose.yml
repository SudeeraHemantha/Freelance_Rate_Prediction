version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: freelance_predictor_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: freelance_predictor
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d freelance_predictor"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile
    container_name: freelance_predictor_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres_password@db:5432/freelance_predictor
      - ENV=production
      - DEBUG=false
    depends_on:
      db:
        condition: service_healthy
    restart: always

  frontend:
    build:
      context: ../frontend
    container_name: freelance_predictor_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: always

volumes:
  postgres_data:
