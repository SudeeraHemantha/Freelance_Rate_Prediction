name: Enterprise CI/CD Pipeline & Docker Build Validation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-lint-and-test:
    name: Backend CI & Automated Validation Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10 Runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Validate Python Syntax & Imports
        run: |
          python -m py_compile backend/app/main.py
          python -m py_compile backend/app/api/v1/predict.py
          python -m py_compile backend/app/ml/train.py

  docker-build-check:
    name: Docker Multi-Stage Image Compilation Verification
    runs-on: ubuntu-latest
    needs: backend-lint-and-test

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx Engine
        uses: actions/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./docker/Dockerfile.backend
          push: false
          tags: freelance-rate-predictor-backend:test

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: freelance-rate-predictor-frontend:test
